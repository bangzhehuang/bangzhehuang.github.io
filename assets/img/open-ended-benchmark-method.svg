<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Open-ended physics research benchmark</title>
  <desc id="desc">An open-ended physics task and three research trajectories that converge on one shared physical ground truth.</desc>

  <defs>
    <marker id="arrow-red" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 18 10 L 0 19 Z" fill="#C5161D"/>
    </marker>
    <marker id="arrow-dark" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 18 10 L 0 19 Z" fill="#646464"/>
    </marker>
    <marker id="arrow-light" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 18 10 L 0 19 Z" fill="#BFC0C2"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111111; }
      .title { font-size: 42px; font-weight: 700; }
      .label { font-size: 23px; font-weight: 700; }
      .body { font-size: 25px; }
      .small { font-size: 21px; }
      .outline { fill: none; stroke: #646464; stroke-width: 3; }
      .dashed { fill: none; stroke: #646464; stroke-width: 3; stroke-dasharray: 11 9; }
      .cell { stroke: #646464; stroke-width: 3; }
      .arrow-red { fill: none; stroke: #C5161D; stroke-width: 5; marker-end: url(#arrow-red); }
      .arrow-dark { fill: none; stroke: #646464; stroke-width: 5; marker-end: url(#arrow-dark); }
      .arrow-light { fill: none; stroke: #BFC0C2; stroke-width: 4; marker-end: url(#arrow-light); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Left: open-ended task -->
  <rect x="42" y="55" width="670" height="790" class="outline"/>
  <rect x="80" y="28" width="600" height="70" fill="#FFFFFF"/>
  <text x="378" y="78" text-anchor="middle" class="title">Open-Ended Physics Task</text>

  <text x="100" y="178" class="label">UNKNOWN RESEARCH ENVIRONMENT</text>
  <rect x="92" y="198" width="336" height="376" class="dashed"/>

  <rect x="132" y="282" width="256" height="210" fill="#FFFFFF" class="cell"/>
  <rect x="132" y="282" width="256" height="78" fill="#FFF1C8" class="cell"/>
  <rect x="132" y="360" width="256" height="132" fill="#F1F1F1" class="cell"/>
  <text x="260" y="331" text-anchor="middle" class="body" font-weight="700">Physics Simulator</text>
  <text x="260" y="416" text-anchor="middle" class="body">Unknown Physical</text>
  <text x="260" y="451" text-anchor="middle" class="body">System</text>

  <rect x="480" y="299" width="204" height="184" class="dashed"/>
  <rect x="507" y="326" width="150" height="130" fill="#FFFFFF" class="cell"/>
  <rect x="507" y="326" width="150" height="54" fill="#FFF1C8" class="cell"/>
  <rect x="507" y="380" width="150" height="76" fill="#F1F1F1" class="cell"/>
  <text x="582" y="361" text-anchor="middle" class="small" font-weight="700">Research</text>
  <text x="582" y="425" text-anchor="middle" class="body">Agent</text>

  <path d="M 582 299 V 225 H 260 V 274" class="arrow-red"/>
  <text x="421" y="252" text-anchor="middle" class="small" fill="#C5161D" font-weight="700">actions</text>

  <path d="M 388 458 H 453 V 520 H 582 V 491" class="arrow-dark"/>
  <rect x="410" y="526" width="150" height="34" fill="#FFFFFF"/>
  <text x="484" y="551" text-anchor="middle" class="small" fill="#646464">observations</text>

  <text x="96" y="661" class="body">
    <tspan font-weight="700">Task:</tspan>
    <tspan> identify the underlying</tspan>
  </text>
  <text x="96" y="700" class="body">physical structure through iterative research.</text>

  <line x1="96" y1="747" x2="659" y2="747" stroke="#D3D3D3" stroke-width="2"/>
  <text x="96" y="787" class="small" fill="#646464">
    <tspan font-weight="700">Evaluation:</tspan>
    <tspan> structure + equivalent observables</tspan>
  </text>

  <!-- Right: diverse research trajectories -->
  <text x="811" y="78" class="title">Diverse Research Trajectories</text>

  <text x="1160" y="120" text-anchor="middle" class="label">INITIAL RESEARCH STATE</text>
  <rect x="1045" y="150" width="230" height="136" class="dashed"/>
  <rect x="1070" y="174" width="180" height="88" fill="#FFFFFF" class="cell"/>
  <rect x="1070" y="174" width="180" height="39" fill="#FFF1C8" class="cell"/>
  <rect x="1070" y="213" width="180" height="49" fill="#F1F1F1" class="cell"/>
  <text x="1160" y="201" text-anchor="middle" class="small" font-weight="700">question</text>
  <text x="1160" y="246" text-anchor="middle" class="small">current state</text>
  <path d="M 1230 174 V 142 H 1095 V 166" class="arrow-red"/>

  <path d="M 1160 286 V 314 L 866 354" class="arrow-light"/>
  <path d="M 1160 286 V 354" class="arrow-light"/>
  <path d="M 1160 286 V 314 L 1440 354" class="arrow-light"/>

  <!-- Simulate path -->
  <text x="865" y="370" text-anchor="middle" class="label">SIMULATE</text>
  <rect x="748" y="387" width="234" height="160" class="dashed"/>
  <rect x="775" y="419" width="180" height="102" fill="#FFFFFF" class="cell"/>
  <rect x="775" y="419" width="180" height="43" fill="#FFF1C8" class="cell"/>
  <rect x="775" y="462" width="180" height="59" fill="#F1F1F1" class="cell"/>
  <text x="865" y="448" text-anchor="middle" class="small" font-weight="700">run experiment</text>
  <text x="865" y="499" text-anchor="middle" class="small">new evidence</text>
  <path d="M 935 419 V 385 H 815 V 411" class="arrow-red" opacity="0.68"/>

  <!-- Observe path -->
  <text x="1160" y="370" text-anchor="middle" class="label">OBSERVE</text>
  <rect x="1043" y="387" width="234" height="160" class="dashed"/>
  <rect x="1070" y="419" width="180" height="102" fill="#FFFFFF" class="cell"/>
  <rect x="1070" y="419" width="180" height="43" fill="#FFE49A" class="cell"/>
  <rect x="1070" y="462" width="180" height="59" fill="#F1F1F1" class="cell"/>
  <text x="1160" y="448" text-anchor="middle" class="small" font-weight="700">measure</text>
  <text x="1160" y="499" text-anchor="middle" class="small">updated state</text>
  <path d="M 1230 419 V 385 H 1110 V 411" class="arrow-red"/>

  <!-- Refine path -->
  <text x="1440" y="370" text-anchor="middle" class="label">REFINE</text>
  <rect x="1323" y="387" width="234" height="160" class="dashed" opacity="0.72"/>
  <rect x="1350" y="419" width="180" height="102" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="3"/>
  <rect x="1350" y="419" width="180" height="43" fill="#FFF1C8" stroke="#8C8C8C" stroke-width="3"/>
  <rect x="1350" y="462" width="180" height="59" fill="#F1F1F1" stroke="#8C8C8C" stroke-width="3"/>
  <text x="1440" y="448" text-anchor="middle" class="small" font-weight="700">revise hypothesis</text>
  <text x="1440" y="499" text-anchor="middle" class="small">revised state</text>
  <path d="M 1510 419 V 385 H 1390 V 411" class="arrow-red" opacity="0.55"/>

  <!-- Convergence on stable ground truth -->
  <path d="M 865 547 L 1045 630" class="arrow-light"/>
  <path d="M 1160 547 V 630" class="arrow-red"/>
  <path d="M 1440 547 L 1270 630" class="arrow-light"/>

  <rect x="992" y="635" width="336" height="185" class="dashed"/>
  <text x="1160" y="673" text-anchor="middle" class="label">
    <tspan>SHARED </tspan><tspan fill="#C5161D">GROUND TRUTH</tspan>
  </text>
  <rect x="1020" y="690" width="280" height="118" fill="#FFFFFF" class="cell"/>
  <rect x="1020" y="690" width="280" height="52" fill="#FFE49A" class="cell"/>
  <rect x="1020" y="742" width="280" height="66" fill="#F1F1F1" class="cell"/>
  <text x="1160" y="724" text-anchor="middle" class="body" font-weight="700">Physical Structure</text>
  <text x="1160" y="783" text-anchor="middle" class="small">Equivalent Observables</text>

  <text x="1160" y="861" text-anchor="middle" class="body">
    <tspan>Different trajectories. </tspan>
    <tspan fill="#C5161D" font-weight="700">One stable target.</tspan>
  </text>
</svg>
